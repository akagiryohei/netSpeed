name: Android Release Build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.NETSPEED_KEYSTORE_BASE64 }}" | base64 -d > keystore/netspeed-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/netspeed-release.jks
          storePassword=${{ secrets.NETSPEED_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.NETSPEED_KEY_ALIAS }}
          keyPassword=${{ secrets.NETSPEED_KEY_PASSWORD }}
          EOF

      - name: Build signed release AAB
        run: ./gradlew :composeApp:bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: netspeed-release-aab
          path: composeApp/build/outputs/bundle/release/*.aab

      - name: Clean up signing material
        if: always()
        run: rm -rf keystore keystore.properties
